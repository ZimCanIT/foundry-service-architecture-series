repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  # Local hooks call terraform and tflint directly, so they run without bash on Windows.
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        entry: python scripts/shared/terraform_hooks.py fmt
        language: system
        files: \.(tf|tfvars)$
      - id: terraform-validate
        name: Terraform validate
        entry: python scripts/shared/terraform_hooks.py validate
        language: system
        files: \.tf$
        exclude: ^(modules|case-studies)/
        require_serial: true
      - id: terraform-tflint
        name: TFLint
        entry: python scripts/shared/terraform_hooks.py tflint
        language: system
        files: \.tf$
        require_serial: true

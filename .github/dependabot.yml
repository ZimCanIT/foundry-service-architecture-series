# Weekly pull requests that move the pinned action commits to newer releases.
# The cooldown holds a new release for 14 days before it is proposed. Security updates skip it.
# Terraform provider pins are not managed here: they move with the series, by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
